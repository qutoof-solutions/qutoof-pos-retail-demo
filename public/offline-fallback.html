<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071521" />
    <link rel="icon" href="/brand/qutoof-business-mark-light.png" />
    <link rel="apple-touch-icon" href="/icons/qutoof-business-pwa-192.png" />
    <title>Qutoof Business | دون اتصال</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #0f172a; background: linear-gradient(135deg, #f8fafc, #edf6f5); }
      main { width: min(100%, 440px); padding: 40px 32px; text-align: center; border: 1px solid #cbd5e1; border-radius: 28px; background: rgba(255,255,255,.96); box-shadow: 0 24px 60px -36px rgba(15,23,42,.5); }
      img { width: 96px; height: 96px; object-fit: contain; }
      h1 { margin: 24px 0 12px; font-size: 26px; }
      p { margin: 0; color: #475569; line-height: 1.9; }
      a { display: inline-flex; margin-top: 24px; padding: 12px 22px; border-radius: 14px; color: #fff; background: #0d9488; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/qutoof-business-mark-light.png" alt="Qutoof Business" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>لا تُخزّن Qutoof Business بيانات الحجز أو لوحة العمل على الجهاز. اتصل بالإنترنت ثم أعد تحميل الصفحة لمتابعة العمل بأمان.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
